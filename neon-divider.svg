<svg width="1200" height="54" viewBox="0 0 1200 54" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"></stop>
      <stop offset="20%" stop-color="#7C3AED"></stop>
      <stop offset="50%" stop-color="#C084FC"></stop>
      <stop offset="80%" stop-color="#7C3AED"></stop>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"></feGaussianBlur>
    </filter>
  </defs>

  <rect x="100" y="26" width="1000" height="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"></animate>
  </rect>

  <rect x="100" y="26" width="1000" height="1" fill="url(#line)"></rect>

  <circle cy="26.5" r="4" fill="#C084FC" filter="url(#glow)">
    <animate attributeName="cx" values="100;1100;100" dur="8s" repeatCount="indefinite"></animate>
  </circle>
</svg>