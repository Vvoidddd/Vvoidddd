<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg">
<stop offset="0%" stop-color="#07070B"></stop>
<stop offset="50%" stop-color="#10091B"></stop>
<stop offset="100%" stop-color="#07070B"></stop>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4"></feGaussianBlur>
</filter>

</defs>


<rect x="20" y="20" width="1160" height="230" rx="20" fill="url(#bg)" stroke="#2A2038"></rect>


<text x="60" y="65" font-family="monospace" font-size="14" fill="#8B5CF6">
void@github:~$ shutdown -r now
</text>


<g font-family="monospace" font-size="14">

<text x="60" y="105" fill="#22C55E">
[ OK ]
</text>

<text x="125" y="105" fill="#E2E8F0">
saving unfinished projects...
</text>


<text x="60" y="135" fill="#EF4444">
[FAIL]
</text>

<text x="125" y="135" fill="#E2E8F0">
too many unfinished projects
</text>


<text x="60" y="165" fill="#22C55E">
[ OK ]
</text>

<text x="125" y="165" fill="#E2E8F0">
ignoring that
</text>


<text x="60" y="195" fill="#22C55E">
[ OK ]
</text>

<text x="125" y="195" fill="#C084FC">
see you in the next commit
</text>

</g>


<rect x="60" y="220" width="1080" height="2" fill="#22172F"></rect>

<rect y="220" width="200" height="2" fill="#C084FC" filter="url(#glow)">

<animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"></animate>

</rect>

</svg>