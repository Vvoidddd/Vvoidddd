<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050507"/><stop offset="48%" stop-color="#0d0715"/><stop offset="100%" stop-color="#050507"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8b5cf6" stroke-width=".45" opacity=".055"/></pattern>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1200" height="1" fill="#ffffff" opacity=".018"/></pattern>
  <clipPath id="window"><rect x="20" y="20" width="1160" height="580" rx="18"/></clipPath>
</defs>
<rect x="20" y="20" width="1160" height="580" rx="18" fill="url(#bg)" stroke="#2a2038" stroke-width="1.5"/>
<g clip-path="url(#window)">
  <rect x="20" y="20" width="1160" height="580" fill="url(#grid)"/>
  <rect x="20" y="20" width="1160" height="580" fill="url(#scan)"/>
  <rect x="20" y="20" width="1160" height="58" fill="#09090d" opacity=".96"/>
  <circle cx="49" cy="49" r="6" fill="#ef4444"/><circle cx="69" cy="49" r="6" fill="#eab308"/><circle cx="89" cy="49" r="6" fill="#22c55e"/>
  <text x="116" y="55" font-family="monospace" font-size="14" fill="#64748b">void@github :: /dev/identity</text>
  <text x="1102" y="55" text-anchor="end" font-family="monospace" font-size="12" fill="#8b5cf6">VOID_OS // build 0x19</text>

  <g>
    <animate attributeName="opacity" values="1;1;1;0;0;0;0;1" keyTimes="0;.48;.52;.55;.58;.91;.95;1" dur="18s" repeatCount="indefinite"/>
    <text x="80" y="115" font-family="monospace" font-size="16" fill="#8b5cf6">void@system:~$</text>
    <text x="225" y="115" font-family="monospace" font-size="16" fill="#e2e8f0">./identify --verbose</text>

    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="160" fill="#94a3b8">[ OK ]</text><text x="145" y="160" fill="#f8fafc">ALIAS</text><text x="260" y="160" fill="#c084fc">Void</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.06;.09;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="205" fill="#94a3b8">[ OK ]</text><text x="145" y="205" fill="#f8fafc">HANDLE</text><text x="260" y="205" fill="#c084fc">Vvoidddd</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.11;.14;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="250" fill="#94a3b8">[ OK ]</text><text x="145" y="250" fill="#f8fafc">ROLE</text><text x="260" y="250" fill="#c084fc">Software Developer / Systems Builder</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.17;.21;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="295" fill="#94a3b8">[ OK ]</text><text x="145" y="295" fill="#f8fafc">STACK</text><text x="260" y="295" fill="#a78bfa">Python / C++ / C# / JS / Lua</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.23;.27;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="340" fill="#94a3b8">[ OK ]</text><text x="145" y="340" fill="#f8fafc">FOCUS</text><text x="260" y="340" fill="#a78bfa">Windows / Systems / Networking / AI</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.29;.33;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="385" fill="#94a3b8">[ OK ]</text><text x="145" y="385" fill="#f8fafc">STATUS</text><text x="260" y="385" fill="#c084fc">building_something_i_want_to_use</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.39;1" dur="18s" repeatCount="indefinite"/></g>
    <g font-family="monospace" font-size="17" opacity="0"><text x="80" y="430" fill="#94a3b8">[ OK ]</text><text x="145" y="430" fill="#f8fafc">MODE</text><text x="260" y="430" fill="#a78bfa">BUILD → BREAK → UNDERSTAND → IMPROVE</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.40;.44;1" dur="18s" repeatCount="indefinite"/></g>

    <rect x="80" y="470" width="1040" height="1" fill="#332344"/>
    <text x="80" y="505" font-family="monospace" font-size="14" fill="#64748b">identity.service</text>
    <text x="235" y="505" font-family="monospace" font-size="14" fill="#22c55e">ACTIVE</text>
    <text x="320" y="505" font-family="monospace" font-size="14" fill="#64748b">// runtime stable</text>
    <rect x="488" y="489" width="9" height="19" fill="#c084fc"><animate attributeName="opacity" values="1;1;0;0;1" dur=".9s" repeatCount="indefinite"/></rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;0" keyTimes="0;.50;.515;.53;.545;.56;.575;.59;1" dur="18s" repeatCount="indefinite"/>
    <rect x="20" y="120" width="1160" height="16" fill="#8b5cf6" opacity=".36"><animate attributeName="y" values="110;450;190;520;230" dur=".25s" repeatCount="indefinite"/></rect>
    <rect x="20" y="280" width="1160" height="7" fill="#ef4444" opacity=".25"><animate attributeName="y" values="500;160;390;100" dur=".19s" repeatCount="indefinite"/></rect>
    <text x="600" y="330" text-anchor="middle" font-family="monospace" font-size="74" font-weight="900" fill="#8b5cf6" opacity=".72">VØID<animateTransform attributeName="transform" type="translate" values="-12 0;16 0;-5 0;8 0;0 0" dur=".14s" repeatCount="indefinite"/></text>
    <text x="605" y="330" text-anchor="middle" font-family="monospace" font-size="74" font-weight="900" fill="#ef4444" opacity=".40">VOID<animateTransform attributeName="transform" type="translate" values="15 0;-10 0;18 0;-4 0;0 0" dur=".12s" repeatCount="indefinite"/></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.57;.60;.90;.93;1" dur="18s" repeatCount="indefinite"/>
    <rect x="20" y="78" width="1160" height="4" fill="#ef4444"><animate attributeName="opacity" values=".25;1;.35;1" dur=".32s" repeatCount="indefinite"/></rect>
    <text x="80" y="122" font-family="monospace" font-size="19" font-weight="700" fill="#fb7185">KERNEL PANIC</text>
    <text x="246" y="122" font-family="monospace" font-size="14" fill="#64748b">:: VOID_OS encountered an unrecoverable developer state</text>
    <g font-family="monospace" font-size="14">
      <text x="80" y="165" fill="#94a3b8">[  19.404833 ] kernel: void_identity_init()</text>
      <text x="80" y="193" fill="#94a3b8">[  19.405019 ] dev/void: loading personality module...</text>
      <text x="80" y="221" fill="#a78bfa">[  19.405921 ] dev/void: SYSTEMS_BUILDER=1</text>
      <text x="80" y="249" fill="#a78bfa">[  19.406125 ] dev/void: CURIOSITY_LIMIT=UNDEFINED</text>
      <text x="80" y="277" fill="#f8fafc">[  19.409404 ] compiler: idea detected</text>
      <text x="80" y="305" fill="#f8fafc">[  19.410931 ] compiler: creating unnecessary project...</text>
      <text x="80" y="333" fill="#f8fafc">[  19.429122 ] project: successfully broke everything</text>
      <text x="80" y="361" fill="#f8fafc">[  19.491820 ] debugger: attempting questionable fix</text>
      <text x="80" y="389" fill="#22c55e">[  20.021551 ] debugger: somehow worked</text>
      <text x="80" y="417" fill="#fb7185">[  20.044404 ] BUG: user attempted to understand everything</text>
      <text x="80" y="445" fill="#94a3b8">[  20.045100 ] scheduler: queued 7 new side projects</text>
    </g>
    <text x="80" y="492" font-family="monospace" font-size="16" fill="#ef4444" filter="url(#glow)">Kernel panic - not syncing: TOO_MANY_PROJECTS</text>
    <text x="80" y="535" font-family="monospace" font-size="13" fill="#64748b">rebooting VOID_OS in 3... 2... 1...</text>
  </g>

  <rect x="20" y="78" width="1160" height="522" fill="#8b5cf6" opacity="0"><animate attributeName="opacity" values="0;0;.65;0;0" keyTimes="0;.93;.95;.965;1" dur="18s" repeatCount="indefinite"/></rect>
  <rect x="20" y="80" width="1160" height="2" fill="#c084fc" opacity=".12"><animate attributeName="y" values="80;596;80" dur="7s" repeatCount="indefinite"/></rect>
</g>
</svg>
