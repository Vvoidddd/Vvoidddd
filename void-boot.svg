<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050507"></stop>
    <stop offset="50%" stop-color="#0D0716"></stop>
    <stop offset="100%" stop-color="#050507"></stop>
</linearGradient>

<linearGradient id="purple">
    <stop offset="0%" stop-color="#6D28D9"></stop>
    <stop offset="50%" stop-color="#A78BFA"></stop>
    <stop offset="100%" stop-color="#7C3AED"></stop>
</linearGradient>

<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#8B5CF6" stroke-width=".5" opacity=".05"></path>
</pattern>

<filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
    <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
</filter>

<clipPath id="window">
    <rect x="20" y="20" width="1160" height="580" rx="20"></rect>
</clipPath>

</defs>


<rect x="20" y="20" width="1160" height="580" rx="20" fill="url(#bg)" stroke="#2E2042"></rect>

<g clip-path="url(#window)">

<rect x="20" y="20" width="1160" height="580" fill="url(#grid)"></rect>


<!-- TITLE BAR -->

<rect x="20" y="20" width="1160" height="58" fill="#09090D"></rect>

<circle cx="50" cy="49" r="6" fill="#EF4444"></circle>
<circle cx="70" cy="49" r="6" fill="#F59E0B"></circle>
<circle cx="90" cy="49" r="6" fill="#22C55E"></circle>

