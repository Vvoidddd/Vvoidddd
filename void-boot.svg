<rect x="75" y="475" width="1050" height="1" fill="#332344"></rect>

<text x="75" y="515" font-family="monospace" font-size="14" fill="#64748B">
identity.service
</text>

<text x="230" y="515" font-family="monospace" font-size="14" fill="#22C55E">
ACTIVE
</text>

