<text x="600" y="340" text-anchor="middle" font-family="monospace" font-size="90" font-weight="900" fill="#8B5CF6" filter="url(#glow)">
VØID

<animateTransform attributeName="transform" type="translate" values="-15 0;18 0;-9 0;12 0;0 0" dur=".12s" repeatCount="indefinite"></animateTransform>

</text>

</g>


