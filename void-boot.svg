<!-- GLITCH -->

<g opacity="0">

<animate attributeName="opacity" values="0;0;1;0;1;0;1;0;0" keyTimes="0;.54;.55;.56;.57;.58;.59;.61;1" dur="18s" repeatCount="indefinite"></animate>

